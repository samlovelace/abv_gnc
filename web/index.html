<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <header class="topbar">
      <div class="left"><span id="conn">● connecting</span></div>
      <div class="center">
        <span class="label"></span>
        <span id="active-policy" class="active-policy">—</span>
      </div>
      <div class="right"><button id="estop">E-STOP</button></div>
    </header>

    <label for="policy-registry">Active Policy:</label>
    <select name="policy-select" id="policy-select">
      <option value="none">None</option>
    </select>
    <button id="policy-switch-btn">Select</button>

    <section class="telemetry-plots">
      <div id="plot-pos" />
      <div id="plot-vel" />
      <div id="plot-input" />
    </section>

    <section class="command-panel">
      <section class="pose-command-panel">
        <label>Pose</label>
        <label>x, y, yaw: </label
        ><input
          id="x-pose"
          type="number"
          value="0"
          min="-1"
          max="1"
          step="0.1"
        />
        <input
          id="y-pose"
          type="number"
          value="0"
          min="-1"
          max="1"
          step="0.1"
        />
        <input
          id="yaw-pose"
          type="number"
          value="0"
          min="-1"
          max="1"
          step="0.1"
        />
        <button id="pose-cmd-btn">Send</button>
      </section>
      <section class="velocity-command-panel">
        <label>Velocity</label>
        <label>x, y, yaw: </label
        ><input
          id="x-vel"
          type="number"
          value="0"
          min="-1"
          max="1"
          step="0.1"
        />
        <input id="y-vel" type="number" value="0" min="-1" max="1" step="0.1" />
        <input
          id="yaw-vel"
          type="number"
          value="0"
          min="-1"
          max="1"
          step="0.1"
        />
        <button id="vel-cmd-btn">Send</button>
      </section>
    </section>
    <section class="topdown">
      <svg
        id="topdown"
        viewBox="0 0 2 4"
        style="width: 100%; height: 100%; background: #111"
      >
        <defs>
          <pattern
            id="minor"
            width="0.25"
            height="0.25"
            patternUnits="userSpaceOnUse"
          >
            <path
              d="M0.25 0 H0 V0.25"
              fill="none"
              stroke="#333"
              stroke-width="0.004"
            />
          </pattern>
        </defs>

        <!-- origin bottom-left, y up -->
        <g id="world" transform="translate(0 4) scale(1 -1)">
          <rect
            width="2"
            height="4"
            fill="url(#minor)"
            stroke="#888"
            stroke-width="0.01"
          />

          <g id="vehicle">
            <rect
              x="-0.15"
              y="-0.15"
              width="0.30"
              height="0.30"
              rx="0.01"
              fill="#999"
            />
            <line
              x1="0"
              y1="0"
              x2="0.25"
              y2="0"
              stroke="#6cf"
              stroke-width="0.008"
            />
          </g>
        </g>
      </svg>
    </section>
  </body>
</html>
