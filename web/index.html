<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <header class="topbar">
      <div class="left"><span id="conn">● connecting</span></div>
      <div class="center">
        <span class="label"></span>
        <span id="active-policy" class="active-policy">—</span>
      </div>
      <div class="right"><button id="stop-btn">STOP</button></div>
    </header>

    <div class="policy-row">
      <label for="policy-registry">Active Policy:</label>
      <select name="policy-select" id="policy-select">
        <option value="none">None</option>
      </select>
      <button id="policy-switch-btn">Select</button>
    </div>

    <main class="main-layout">
      <section class="topdown">
        <svg id="topdown-svg" viewBox="0 0 1.8 3.6">
          <defs>
            <pattern
              id="minor"
              width="0.25"
              height="0.25"
              patternUnits="userSpaceOnUse"
            >
              <path
                d="M 0.25 0 H 0 V 0.25"
                fill="none"
                stroke="#333"
                stroke-width="0.0075"
              />
            </pattern>
          </defs>

          <g id="world" transform="translate(1.8 3.6) rotate(-90) scale(1 -1)">
            <rect
              width="3.6"
              height="1.8"
              fill="url(#minor)"
              stroke="#888"
              stroke-width="0.01"
            />

            <g id="vehicle">
              <!-- thrusters (x8) and the camera housing/FOV wedge are built
              in vehicle-glyph.ts from halfLength/halfWidth, mirroring
              abv_gui's TableTopView::drawRobot - see that file for the
              reference geometry this is ported from -->
              <rect
                x="-0.175"
                y="-0.175"
                width="0.35"
                height="0.35"
                fill="#999"
              />
            </g>
          </g>
        </svg>
      </section>

      <section class="telemetry-plots">
        <div id="plot-pos"></div>
        <div id="plot-vel"></div>
        <div id="plot-input"></div>
      </section>

      <section class="command-panel">
        <section class="pose-command-panel">
          <label>Pose</label>
          <label>x, y, yaw: </label
          ><input
            id="x-pose"
            type="number"
            value="0"
            min="-1"
            max="1"
            step="0.1"
          />
          <input
            id="y-pose"
            type="number"
            value="0"
            min="-1"
            max="1"
            step="0.1"
          />
          <input
            id="yaw-pose"
            type="number"
            value="0"
            min="-1"
            max="1"
            step="0.1"
          />
          <button id="pose-cmd-btn">Send</button>
        </section>
        <section class="velocity-command-panel">
          <label>Velocity</label>
          <label>x, y, yaw: </label
          ><input
            id="x-vel"
            type="number"
            value="0"
            min="-1"
            max="1"
            step="0.1"
          />
          <input
            id="y-vel"
            type="number"
            value="0"
            min="-1"
            max="1"
            step="0.1"
          />
          <input
            id="yaw-vel"
            type="number"
            value="0"
            min="-1"
            max="1"
            step="0.1"
          />
          <button id="vel-cmd-btn">Send</button>
        </section>
      </section>
    </main>
  </body>
</html>
