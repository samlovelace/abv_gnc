<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <header class="topbar">
      <div class="left"><span id="conn">● connecting</span></div>
      <div class="center">
        <span class="label">Active Policy:</span>
        <span id="active-policy" class="policy">—</span>
      </div>
      <div class="right"><button id="stop-btn">STOP</button></div>
    </header>

    <main class="main-layout">
      <div class="right-column"></div>
    </main>

    <!-- Panel templates: inert until main.ts clones the ones named in
         panels.json and mounts them. Each <template> here corresponds to
         one entry in src/panel-registry.ts - see that file for the
         mapping to Handler classes and mount points. -->

    <template id="panel-policy">
      <div class="policy-row">
        <label for="policy-select">Policy:</label>
        <select name="policy-select" id="policy-select">
          <option value="none">None</option>
        </select>
        <button id="policy-switch-btn">Select</button>
      </div>
    </template>

    <template id="panel-topdown">
      <section class="topdown">
        <svg id="topdown-svg" viewBox="0 0 1.8 3.6">
          <defs>
            <pattern
              id="minor"
              width="0.25"
              height="0.25"
              patternUnits="userSpaceOnUse"
            >
              <path
                d="M 0.25 0 H 0 V 0.25"
                fill="none"
                stroke="#333"
                stroke-width="0.0075"
              />
            </pattern>
          </defs>

          <g id="world" transform="translate(1.8 3.6) rotate(-90) scale(1 -1)">
            <rect
              width="3.6"
              height="1.8"
              fill="url(#minor)"
              stroke="#888"
              stroke-width="0.01"
            />

            <g id="vehicle">
              <!-- thrusters (x8) and the camera housing/FOV wedge are built
              in vehicle-glyph.ts from halfLength/halfWidth, mirroring
              abv_gui's TableTopView::drawRobot - see that file for the
              reference geometry this is ported from -->
              <rect
                x="-0.175"
                y="-0.175"
                width="0.35"
                height="0.35"
                fill="#999"
              />
            </g>
          </g>
        </svg>
      </section>
    </template>

    <template id="panel-telemetry">
      <section class="telemetry-plots">
        <div id="plot-pos"></div>
        <div id="plot-vel"></div>
        <div id="plot-input"></div>
      </section>
    </template>

    <template id="panel-command">
      <section class="command-panel">
        <label>Command</label>
        <div class="command-mode-row">
          <select id="command-mode-select">
            <option value="pose">Pose</option>
            <option value="velocity">Velocity</option>
            <option value="path">Path</option>
            <option value="thruster">Thruster</option>
          </select>
          <label class="body-frame-label">
            <input type="checkbox" id="body-frame-checkbox" />
            Body Frame
          </label>
        </div>

        <section class="pose-command-panel" data-mode-panel="pose">
          <div class="pose-cmd-x-row">
            <label for="pose-cmd-x">x:</label
            ><input
              id="pose-cmd-x"
              type="number"
              value="0"
              min="-100"
              max="100"
              step="0.05"
            />
          </div>
          <div class="pose-cmd-y-row">
            <label for="pose-cmd-y">y: </label>
            <input
              id="pose-cmd-y"
              type="number"
              value="0"
              min="-100"
              max="100"
              step="0.05"
            />
          </div>
          <div class="pose-cmd-yaw-row">
            <label for="pose-cmd-yaw">yaw: </label>
            <input
              id="pose-cmd-yaw"
              type="number"
              value="0"
              min="-100"
              max="100"
              step="0.05"
            />
          </div>
          <button id="pose-cmd-btn">Send</button>
        </section>

        <section class="velocity-command-panel" data-mode-panel="velocity">
          <div class="vel-cmd-x-row">
            <label for="vel-cmd-x">x:</label>
            <input
              id="vel-cmd-x"
              type="number"
              value="0"
              min="-10"
              max="10"
              step="0.05"
            />
          </div>
          <div class="vel-cmd-y-row">
            <label for="vel-cmd-y">y:</label>
            <input
              id="vel-cmd-y"
              type="number"
              value="0"
              min="-10"
              max="10"
              step="0.05"
            />
          </div>
          <div class="vel-cmd-yaw-row">
            <label for="vel-cmd-yaw">yaw:</label>
            <input
              id="vel-cmd-yaw"
              type="number"
              value="0"
              min="-10"
              max="10"
              step="0.05"
            />
          </div>
          <button id="vel-cmd-btn">Send</button>
        </section>

        <section class="path-command-panel" data-mode-panel="path">
          <div class="path-type-row">
            <label>Path Type: </label>
            <select id="path-type-select">
              <option value="File">File</option>
            </select>
          </div>
          <div class="path-duration-row">
            <label>Duration (s): </label
            ><input
              id="path-duration"
              type="number"
              value="0"
              min="0"
              max="1000"
              step="1"
            />
          </div>
          <button id="path-cmd-btn">Send</button>
        </section>

        <section class="thruster-command-panel" data-mode-panel="thruster">
          <label>Thrusters</label>
          <div id="thruster-grid" class="thruster-grid"></div>
          <label>Axes</label>
          <div id="axis-grid" class="axis-grid"></div>
        </section>
      </section>
    </template>

    <template id="panel-camera">
      <section class="camera-view">
        <img id="camera" alt="MuJoCo Camera" />
        <canvas id="camera-overlay"></canvas>
      </section>
    </template>

    <template id="manip-command">
      <section class="manip-command-panel">
        <div class="manip-enable-row">
          <label>Arm</label>
          <button id="manip-enable-pill" class="enable-pill" data-state="disabled">
            Disabled
          </button>
        </div>

        <label>Command</label>
        <div class="command-mode-row">
          <select id="manip-mode-select">
            <option value="joint_pos">Joint Position</option>
            <option value="joint_vel">Joint Velocity</option>
            <option value="task_pos">Task Position</option>
            <option value="task_vel">Task Velocity</option>
          </select>
        </div>

        <section class="joint-pos-panel" data-mode-panel="joint_pos">
          <div id="joint-pos-rows" class="joint-rows"></div>
        </section>

        <section class="joint-vel-panel" data-mode-panel="joint_vel">
          <div id="joint-vel-rows" class="joint-rows"></div>
        </section>

        <section class="task-pos-panel" data-mode-panel="task_pos">
          <div class="task-axis-row">
            <label for="task-pos-x">x (m):</label>
            <input id="task-pos-x" type="number" value="0" step="0.005" />
          </div>
          <div class="task-axis-row">
            <label for="task-pos-y">y (m):</label>
            <input id="task-pos-y" type="number" value="0" step="0.005" />
          </div>
          <div class="task-axis-row">
            <label for="task-pos-z">z (m):</label>
            <input id="task-pos-z" type="number" value="0" step="0.005" />
          </div>
          <div class="task-axis-row">
            <label for="task-pos-roll">roll (rad):</label>
            <input id="task-pos-roll" type="number" value="0" step="0.01" />
          </div>
          <div class="task-axis-row">
            <label for="task-pos-pitch">pitch (rad):</label>
            <input id="task-pos-pitch" type="number" value="0" step="0.01" />
          </div>
          <div class="task-axis-row">
            <label for="task-pos-yaw">yaw (rad):</label>
            <input id="task-pos-yaw" type="number" value="0" step="0.01" />
          </div>
        </section>

        <section class="task-vel-panel" data-mode-panel="task_vel">
          <div id="task-vel-rows" class="joint-rows"></div>
        </section>

        <div class="gripper-row">
          <label for="gripper-cmd">Gripper:</label>
          <input
            id="gripper-cmd"
            type="range"
            value="0"
            min="0"
            max="1"
            step="0.001"
            disabled
          />
          <span id="gripper-value">—</span>
        </div>
      </section>
    </template>
  </body>
</html>
