ObjDetection:
  Type: yolo11-seg # which IDetector implementation to instantiate
  ModelPath: /home/sam/models/yolo11n-seg.onnx
  InputSize: 640
  ConfThresh: 0.45
  IouThresh: 0.15
  UseCuda: false

  # must match the model's training/export classes in number and order -
  # this is COCO-80, correct for the stock yolo11n-seg.pt export
  ClassNames:
    [
      person,
      bicycle,
      car,
      motorcycle,
      airplane,
      bus,
      train,
      truck,
      boat,
      traffic light,
      fire hydrant,
      stop sign,
      parking meter,
      bench,
      bird,
      cat,
      dog,
      horse,
      sheep,
      cow,
      elephant,
      bear,
      zebra,
      giraffe,
      backpack,
      umbrella,
      handbag,
      tie,
      suitcase,
      frisbee,
      skis,
      snowboard,
      sports ball,
      kite,
      baseball bat,
      baseball glove,
      skateboard,
      surfboard,
      tennis racket,
      bottle,
      wine glass,
      cup,
      fork,
      knife,
      spoon,
      bowl,
      banana,
      apple,
      sandwich,
      orange,
      broccoli,
      carrot,
      hot dog,
      pizza,
      donut,
      cake,
      chair,
      couch,
      potted plant,
      bed,
      dining table,
      toilet,
      tv,
      laptop,
      mouse,
      remote,
      keyboard,
      cell phone,
      microwave,
      oven,
      toaster,
      sink,
      refrigerator,
      book,
      clock,
      vase,
      scissors,
      teddy bear,
      hair drier,
      toothbrush,
    ]

# Consumed by autobot_obj_segmentation.
ObjSegmentation:
  SyncSlopSec: 0.05
  MinPointsPerObject: 20
  MaxPointsPerObject: 0
  MaskErosionKernelSize: 5
  OutlierMeanK: 8
  OutlierStdDevMultiplier: 1.0

# Consumed by autobot_obj_registry.
ObjRegistry:
  MatchDistanceThresholdM: 0.5
  StalenessTimeoutSec: 10.0
  PruneRateHz: 1.0

# Consumed by autobot_camera_tf (broadcasts this as a static TF) and
# autobot_obj_segmentation (looks it up to express observations in WorldFrame).
# Translation/rotation default to the MuJoCo tabletop sim's overhead camera
# (sim/mujoco/worlds/rebot-tabletop.xml: pos="0 0 1.65", looking straight down,
# no additional rotation) - verify/tune against real centroid/height values
# before trusting this on hardware.
CameraExtrinsics:
  CameraFrame: overhead_camera
  WorldFrame: world
  TranslationXYZ: [0.0, 0.0, 1.65]
  RotationQuaternionXYZW: [1.0, 0.0, 0.0, 0.0]
